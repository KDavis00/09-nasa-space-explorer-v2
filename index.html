<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <button id="getImageBtn">Fetch Space Images</button>
    </div>

    <div id="loading">Click "Fetch Space Images" to explore the cosmos!</div>

    <div id="gallery" class="gallery">
      <!-- Gallery items will be injected here -->
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span id="closeBtn" class="close">&times;</span>
      <div id="modal-media"></div>
      <h2 id="modal-title"></h2>
      <p id="modal-date"></p>
      <p id="modal-explanation"></p>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
